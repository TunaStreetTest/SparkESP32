<!doctype html>
<!-- GitHub social preview, 1280x640. Render:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1280,640 --force-device-scale-factor=2 --virtual-time-budget=8000 \
    --screenshot=assets/social-preview.png assets/social-preview.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SparkESP32 social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #080a07;
    --green: #76b900;
    --text: #f2f4ef;
    --dim: #a3ab9b;
    --faint: #5d6457;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body {
    position: relative;
    font-family: Montserrat, -apple-system, "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(620px 520px at 960px 330px, rgba(118, 185, 0, 0.20), transparent 70%),
      radial-gradient(900px 700px at 0 0, rgba(118, 185, 0, 0.05), transparent 60%),
      var(--bg);
  }
  /* faint dot grid, fades toward the device */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1.4px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), transparent 62%);
  }

  .copy { position: absolute; left: 84px; top: 0; bottom: 0; width: 600px;
          display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-weight: 600; font-size: 17px; letter-spacing: 0.22em; color: var(--green);
             text-transform: uppercase; margin-bottom: 18px; }
  h1 { font-weight: 800; font-size: 92px; line-height: 0.95; letter-spacing: -0.035em; }
  h1 span { color: var(--green); }
  .tagline { margin-top: 26px; font-weight: 500; font-size: 29px; line-height: 1.32;
             color: var(--dim); max-width: 540px; }
  .tagline b { color: var(--text); font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; max-width: 580px; }
  .pill { font-weight: 600; font-size: 17px; color: var(--text); padding: 10px 18px;
          border-radius: 999px; border: 1px solid rgba(118, 185, 0, 0.45);
          background: rgba(118, 185, 0, 0.08); white-space: nowrap; }
  .url { position: absolute; left: 84px; bottom: 42px; font-family: "JetBrains Mono", ui-monospace, monospace;
         font-size: 18px; color: var(--faint); }

  /* the board: square AMOLED module, USB-C on the right (the default rotation) */
  .device { position: absolute; left: 748px; top: 92px; width: 456px; height: 456px;
            transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); transform-origin: 40% 50%; }
  .bezel { position: absolute; inset: 0; border-radius: 44px;
           background: linear-gradient(145deg, #262a24 0%, #0c0d0b 38%, #050605 100%);
           box-shadow:
             0 0 0 1px rgba(255,255,255,0.07) inset,
             0 1px 0 rgba(255,255,255,0.14) inset,
             0 0 90px rgba(118, 185, 0, 0.35),
             0 40px 80px rgba(0, 0, 0, 0.6); }
  .bezel::after { /* rim light along the top-left edge */
    content: ""; position: absolute; inset: 0; border-radius: 44px; padding: 1.5px;
    background: linear-gradient(135deg, rgba(160, 230, 60, 0.85), rgba(118,185,0,0.0) 42%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }
  .screen { position: absolute; left: 24px; top: 24px; width: 408px; height: 408px;
            border-radius: 26px; overflow: hidden; background: #000;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.9); }
  .screen img { width: 100%; height: 100%; display: block; image-rendering: auto; }
  .screen::after { /* glass sheen */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(125deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 30%, transparent 46%); }
  .usbc { position: absolute; right: -9px; top: 198px; width: 12px; height: 60px; border-radius: 6px;
          background: linear-gradient(90deg, #1b1d19, #3a3e36); box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">Open source · MIT</div>
    <h1>Spark<span>ESP32</span></h1>
    <p class="tagline">A status display and power light for the <b>NVIDIA DGX Spark</b>.</p>
    <div class="pills">
      <div class="pill">ESP32-C6 · 2.16″ AMOLED</div>
      <div class="pill">USB-C or Wi-Fi</div>
      <div class="pill">One-command install</div>
    </div>
  </div>
  <div class="url">github.com/twidtwid/SparkESP32</div>

  <div class="device">
    <div class="usbc"></div>
    <div class="bezel"></div>
    <div class="screen"><img src="screen.png" alt=""></div>
  </div>
</body>
</html>
